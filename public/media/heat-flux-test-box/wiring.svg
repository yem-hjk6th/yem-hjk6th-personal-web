 y="356" text-anchor="end">D9</text><text class="p" x="745" y="186" text-anchor="middle">SPI + power</text><text class="s" x="814" y="364" text-anchor="start">raw code → offset → µV → W/m²</text><rect class="box boxg" x="1230" y="78" width="370" height="300"/><text class="t" x="1244" y="108" text-anchor="start">PC (USB port 1)</text><text class="s" x="1244" y="130" text-anchor="start">save_serial_csv.py (pyserial)</text><text class="s" x="1244" y="150" text-anchor="start">parses chN lines, time-stamps rows</text><rect class="box boxg" x="1244" y="268" width="342" height="62"/><text class="s" x="1258" y="296" text-anchor="start">HF_exp_batchN_&lt;timestamp&gt;.csv</text><text class="p" x="1258" y="316" text-anchor="start">ts, channel, raw, bytes, corrected, uV, q_Wm2, T_C</text><path class="w wg" d="M1415 168V268" marker-end="url(#ag)"/><path class="w wg" d="M1070 178H1230" marker-end="url(#ag)"/><circle cx="1070" cy="178" r="3.4" fill="#F2C14E"/><text class="p" x="1150" y="164" text-anchor="middle">USB serial</text><text class="p" x="1150" y="201" text-anchor="middle">115200 baud</text><path class="w wp" d="M1230 238H1070" marker-end="url(#ap)"/><text class="p" x="1150" y="228" text-anchor="middle">'z' command</text><text class="p" x="1150" y="261" text-anchor="middle">zero-offset, EEPROM</text><rect class="box boxb" x="40" y="504" width="230" height="76"/><text class="t" x="54" y="534" text-anchor="start">4× K-type thermocouple</text><text class="s" x="54" y="556" text-anchor="start">CH1 plate · CH2–CH4 panel top</text><rect class="box boxb" x="440" y="504" width="250" height="76"/><text class="t" x="454" y="534" text-anchor="start">4-channel K-type logger</text><text class="s" x="454" y="556" text-anchor="start">digital thermometer, CH1–CH4</text><path class="w wb" d="M270 542H440" marker-end="url(#ab)"/><circle cx="270" cy="542" r="3.4" fill="#A3C8FF"/><rect class="box boxb" x="800" y="504" width="270" height="76"/><text class="t" x="814" y="534" text-anchor="sta