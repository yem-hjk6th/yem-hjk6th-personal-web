<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 610" role="img" aria-label="Signal chain of the heat-flux logger: three PHFS-01 heat-flux sensors feed an ADS1256 24-bit ADC, which talks over SPI to an Arduino UNO, which sends serial text over USB to a PC script that writes a CSV. Four K-type thermocouples go to a separate four-channel logger and its own PC software."><defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9Z" fill="#A3C8FF"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9Z" fill="#F2C14E"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9Z" fill="#9a9aa2"/></marker>
</defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#ececf0}
.t{font-size:17px;font-weight:600}.s{font-size:13px;fill:#c4c4ca}.p{font-size:12.5px;fill:#c4c4ca}
.tb{fill:#A3C8FF}.tg{fill:#F2C14E}
.box{fill:#222226;stroke:#d0d0d4;stroke-width:1.6;rx:10}
.boxb{stroke:#A3C8FF}.boxg{stroke:#F2C14E}
.w{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.wb{stroke:#A3C8FF}.wg{stroke:#F2C14E}.wp{stroke:#9a9aa2;stroke-width:1.6}
.lane{fill:none;stroke:#6c6c74;stroke-width:1;stroke-dasharray:2 5}
