- slug: vision-guided-pellet-extrusion
  title: "Vision-controlled closed-loop robotic additive manufacturing"
  years: "2025 - present"
  meta:
    place: "Computational Tectonics Lab, UVA"
    role: "Doctoral research"
  tags: [robotics, cv, fabrication]
  role: "Doctoral research. I instrumented the lab's KUKA KR10 pellet-extrusion cell with RSI telemetry, a stereo camera, a bead camera and a nozzle borescope on custom printed mounts, wrote a logger that records robot pose, speed and commanded extruder speed in sync with video, calibrated the camera to the robot, and trained a model that reads bead width from borescope images. The robot, extruder and base control chain were set up earlier in the lab."
  credits: "Computational Tectonics Lab, University of Virginia; advisor Ehsan Baharlou."
  problem: "In robotic extrusion the robot slows at corners while the extruder keeps its commanded speed, so the deposited bead changes. The process is hard to observe while it runs."
  what_i_did: "Built the sensing and logging setup, ran printing experiments, calibrated the stereo camera to the robot, profiled depth accuracy against distance, and benchmarked deep-learning models for bead-width measurement. Then built a closed-loop controller: a camera reads the bead width while printing, and the PC adjusts the robot's speed override through RSI every few milliseconds."
  story:
    - id: print-head
      heading: "The print head"
      body: "A single-screw pellet extruder on a KUKA KR10 robot arm, with a 3D-printed cage that holds cameras and borescopes near the nozzle. The drawing cuts the extruder open to show the screw carrying pellets down to the nozzle. It was drawn from a 3D scan of the extruder, the vendor's CAD model and the cage CAD; the inside of the screw channels is schematic."
      images:
        - src: vision-guided-pellet-extrusion/head_site_site_labeled.png
          narrow_src: vision-guided-pellet-extrusion/head_site_portrait.png
          alt: "Drawing of the print head over the print bed: servo motor and gearbox on top, the pellet hopper and feed pipe, the extruder cut open to show the screw, and the printed sensor cage around the barrel holding cameras on tilted arms and borescopes beside the nozzle. A close-up shows the die exit, a borescope head, a camera's sight line and the fresh bead."
          caption: "Drawing: the print head with its sensor cage. Gold marks the material, blue the cameras' sight lines."
    - id: cl-print
      heading: "A closed-loop print, and which pair steers"
      body: "A closed-loop print on the four-pair cage, six times faster, through the four cameras; the lit border marks the pair whose reading steers the speed. Along the path, each segment is coloured by the pair in control, and the radar shows the same by travel heading. Held: the last speed is kept while no reading is valid; open: the preset speed is used."
      videos:
        - src: vision-guided-pellet-extrusion/vision_cl_print_fast.mp4
          poster: vision-guided-pellet-extrusion/vision_cl_print_fast_poster.jpg
          caption: "A closed-loop print on the KUKA KR10 with the four-pair cage, November 2026, shown six times faster through the four cameras."
        - src: vision-guided-pellet-extrusion/vision_cl_control_map.mp4
          poster: vision-guided-pellet-extrusion/vision_cl_control_map_poster.jpg
          caption: "The same print: path segments coloured by the pair in control, and a radar of control by travel heading, from the print's controller log."
    - id: closed-loop
      heading: "Sensing and closed loop (in progress)"
      body: "A sensor cage around the nozzle carries four pairs, each a borescope and an ELP camera, placed ninety degrees apart so that one pair trails the nozzle whatever the travel direction. Learned readers turn each image into a bead width, and the speed command follows a width law with a gated correction every quarter second. Ideas under study include fusing the views of several pairs and starting every reader from a pretrained vision backbone. The work is in progress and unpublished."
      videos:
        - src: vision-guided-pellet-extrusion/vision_cl_sensing_v2.mp4
          poster: vision-guided-pellet-extrusion/vision_cl_sensing_v2_poster.jpg
          caption: "Open loop, then the four borescope and ELP pairs around the nozzle; each pair leads over a 90-degree range of travel direction (schematic)."
        - src: vision-guided-pellet-extrusion/vision_cl_architecture_v3.mp4
          poster: vision-guided-pellet-extrusion/vision_cl_architecture_v3_poster.jpg
          caption: "Reader and controller architecture; the fusion and pretrained-backbone ideas are in progress (schematic)."
    - id: code
      heading: "Code"
      body: "The PC side of the loop is open source as a ROS 2 port, with a simulator of the robot controller and a replay of one logged print."
  result: "Closed-loop prints ran in 2026; results are in preparation."
  links:
    - label: "ROS 2 port of the closed-loop pipeline (code and a real session log)"
      url: "https://github.com/yem-hjk6th/RSI_proj_ROS"
  media:
    thumbnail:
      src: vision-guided-pellet-extrusion/head_site_site.png
      alt: "Drawing of the print head: a pellet extruder cut open to show the screw, inside a printed sensor cage with cameras and borescopes, over the print bed"
      fit: contain
    video:
      src: vision-guided-pellet-extrusion/vision_cl_header.mp4
      poster: vision-guided-pellet-extrusion/vision_cl_header_poster.jpg
      caption: "Open loop: the program sets the speed and nothing measures the bead. Closed loop: sensor pairs read the bead and steer the robot's path speed (schematic)."
- slug: mycelium-mineral-panels
  title: "Mycelium-mineral composite panels"
  years: "2025"
  meta:
    role: "Co-author, digital fabrication"
  tags: [fabrication, aec, robotics]
  role: "Co-author. Digital fabrication: implemented the three toolpath algorithms (Poisson-disk + TSP, Kangaroo, Hilbert), computed the predicted growth area, and printed the panels on the KUKA robot."
  credits: "With I. Datta and E. Baharlou (ACADIA 2025)."
  problem: "Printed mineral panels can host mycelium growth, and the printed path shapes how much surface the fungus can colonize."
  what_i_did: "Implemented the three toolpath strategies compared in the paper: Poisson-disk sampling with a nearest-neighbour travelling-salesman route and 2-opt optimization, a Kangaroo 2 physics-based relaxation in Grasshopper, and a recursive Hilbert curve in GHPython. Computed the predicted mycelium growth area of each pattern, and printed the oyster-shell mineral panels, up to 400 × 400 mm, with a KUKA KR 10 R1100-2 arm and a WASP LDM extruder (4 mm nozzle, 2 mm layers) programmed through KUKA|prc."
  result: "The Hilbert pattern gave the largest predicted mycelium growth area (44.6% versus 27.9-34.8%)."
  publications: [datta-2025-acadia]
  links:
    - label: "ACADIA 2025 paper"
      url: "https://doi.org/10.52842/conf.acadia.2025.2.170"
  story:
    - id: printing-and-panels
      heading: "Printing and the final panels"
      body: "A Hilbert panel being printed on the KUKA arm, and the two final panels, colonized by mycelium, stacked on their stand."
      images:
        - src: mycelium-mineral-panels/printing_and_stand_pair_v3.jpg
          alt: "Two photos side by side. Left: against a plain light grey backdrop, a KUKA arm with a blue extruder head prints grey oyster-shell paste in a Hilbert pattern on a square panel. Right: two square panels in wooden frames, stacked upright on a wooden stand against a white backdrop, their Hilbert rails partly covered by white mycelium; the base of the stand is cropped."
          caption: "Left: printing a Hilbert panel, May 2025. Right: the two final panels on their stand, June 2025."
  media:
    thumbnail:
      src: mycelium-mineral-panels/lead_w18_poster.jpg
      alt: "On black, a square Hilbert panel with dark grey printed rails and fine orange-red mycelium lines growing in the gaps and partly over the rails; two circles on it lead to detail boxes: hyphae bridging two adjacent rails, and strands spanning the air gap between two stacks of printed beads."
      fit: contain
    video:
      src: mycelium-mineral-panels/lead_w18.mp4
      poster: mycelium-mineral-panels/lead_w18_poster.jpg
      caption: "Plane: points from each printed toolpath connected in print order, with the paper's predicted growth areas. Volume: the predicted growth space of one 2 mm layer (red), then the stacked layers. Growth: mycelium drawn from photos of the panels; the two details follow the paper's wording (Sections 3.4 and 4.3) and are schematic."
