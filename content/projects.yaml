- slug: vision-guided-pellet-extrusion
  title: "Robot telemetry and vision for pellet extrusion"
  years: "2025 - present"
  tags: [robotics, cv, fabrication]
  role: "Doctoral research. I instrumented the lab's KUKA KR10 pellet-extrusion cell with RSI telemetry, a stereo camera, a bead camera and a nozzle borescope on custom printed mounts, wrote a logger that records robot pose, speed and commanded extruder speed in sync with video, calibrated the camera to the robot, and trained a model that reads bead width from borescope images. The robot, extruder and base control chain were set up earlier in the lab."
  credits: "Computational Tectonics Lab, University of Virginia; advisor Ehsan Baharlou."
  problem: "In robotic extrusion the robot slows at corners while the extruder keeps its commanded speed, so the deposited bead changes. The process is hard to observe while it runs."
  what_i_did: "Built the sensing and logging setup, ran printing experiments, calibrated the stereo camera to the robot, profiled depth accuracy against distance, and benchmarked deep-learning models for bead-width measurement. Then built a closed-loop controller: a camera reads the bead width while printing, and the PC adjusts the robot's speed override through RSI every few milliseconds."
  result: "Closed-loop prints ran in 2026; results are in preparation."
  links:
    - label: "ROS 2 port of the closed-loop pipeline (code and a real session log)"
      url: "https://github.com/yem-hjk6th/RSI_proj_ROS"
  media: []
- slug: rsi-proj-ros
  title: "ROS 2 port of a robot speed-override controller"
  years: "2026"
  tags: [robotics, software]
  role: "Author. Implemented with Claude Code (AI coding assistant)."
  credits: "Repository author: Ye Ma."
  problem: "A lab pipeline that controls a KUKA robot's speed in real time ran as Windows scripts. To share it and reuse it on another robot, it needed a tested, documented code base."
  what_i_did: "Ported the pipeline to ROS 2 (Jazzy): an RSI bridge with a 4 ms reply loop in its own process, the control law, the camera width readout, an EthernetKRL bridge for a robot without RSI, session recording with rosbag2, and a replay of a real print that checks the port against the original logs. Safety rules (no path correction, override clamp, watchdog ramp) are enforced in code and tested in CI."
  result: "In a lock-step replay of a real print, the ported controller reproduces the original pipeline's speed commands at all 1719 updates."
  links:
    - label: "GitHub repository"
      url: "https://github.com/yem-hjk6th/RSI_proj_ROS"
  media: []
- slug: mycelium-mineral-panels
  title: "Toolpath-informed mycelium-mineral panels"
  years: "2025"
  tags: [fabrication, aec, robotics]
  role: "Co-author. Digital fabrication: implemented the three toolpath algorithms (Poisson-disk + TSP, Kangaroo, Hilbert), computed the predicted growth area, and printed the panels on the KUKA robot."
  credits: "With I. Datta and E. Baharlou (ACADIA 2025)."
  problem: "Printed mineral panels can host mycelium growth, and the printed path shapes how much surface the fungus can colonize."
  what_i_did: "The paper compares three toolpath strategies (Poisson-disk sampling with a travelling-salesman route, Kangaroo physics, and a recursive Hilbert curve) for robotically printed 400 x 400 mm oyster-shell mineral panels."
  result: "The Hilbert pattern gave the largest predicted mycelium growth area (44.6% versus 27.9-34.8%)."
  links:
    - label: "ACADIA 2025 paper"
      url: "https://doi.org/10.52842/conf.acadia.2025.2.170"
  media: []
