- slug: clay-paste-extruder
  title: "Clay extrusion: a speed model for robotic printing"
  years: "2024 - 2025"
  meta:
    role: "Graduate research assistant"
  tags: [robotics, fabrication]
  role: "Graduate research assistant. I set up the extruder, wiring and control, calibrated its speed, wrote the KUKA robot programs and ran the print trials."
  credits: "Clay recipe and process guidance from I. Datta and E. Baharlou."
  problem: "Make a paste extruder print reliably on a KUKA KR10 with a clay mix, at a robot speed that matches the extrusion speed."
  what_i_did: "Mounted a WASP clay kit on the robot, wired the stepper motor, driver and Arduino controller, calibrated extrusion speed, and mapped water content, air pressure and robot speed over ten trials. From 45 timed bench runs, a regression model predicts the extrusion speed of any air pressure and motor setting, so the settings can be chosen for a target robot speed."
  story:
    - id: speed-model
      heading: "From bench tests to a speed model"
      body: "Extrusion speed was timed three times for each air pressure and motor setting. Five regression models were compared by holding out one setting at a time and predicting it from the others; a model with a pressure x motor-setting interaction predicted held-out settings about as closely as a stopwatch can measure. Calibrating the motor showed that at 400 pulses per revolution it ran about twice the calculated speed; at 800 the two matched."
      videos:
        - src: clay-paste-extruder/clay_speed_concept_v2.mp4
          poster: clay-paste-extruder/clay_speed_concept_v2_poster.jpg
          caption: "Schematic of the bench data, the speed model and the motor calibration."
    - id: column-toolpath
      heading: "A clay column toolpath"
      body: "The robot program for the 650 mm clay column of the Living Column exhibition (2025): 153 layers and about 1.6 km of toolpath, drawn here from the .src file."
      images:
        - src: clay-paste-extruder/clay_column_toolpath.png
          alt: "An isometric line drawing on black of a tall tapered column made of 153 stacked layers of a wavy toolpath, lighter towards the top."
          caption: "Toolpath drawn from the KUKA .src program; toolpath by E. Baharlou."
      link:
        label: "Eco-Resilience Tectonics: Living Column exhibition (CT .lab, UVA)"
        url: "https://ct.lab.virginia.edu/?p=234813"
  result: "A pressure x motor-setting model learned from 45 timed runs predicts the extrusion speed of an unseen setting within 1.2 mm/s (RMS), close to the stopwatch noise, and gives the extruder settings for a target robot speed."
  links: []
  media:
    thumbnail:
      src: clay-paste-extruder/clay_speed_lead_v3_poster.jpg
      alt: "On black, a gold heat map of predicted extrusion speed over air pressure and motor setting with a white 8 mm/s contour, next to a clay-coloured grid printed layer by layer."
      fit: contain
    video:
      src: clay-paste-extruder/clay_speed_lead_v3.mp4
      poster: clay-paste-extruder/clay_speed_lead_v3_poster.jpg
      caption: "One timed bench run, the speed model learned from 45 of them, the settings it gives for 8 mm/s, a grid printed at the matched robot speed, and what happens to the bead when the robot moves slower or faster (illustrations)."
- slug: wood-hygroscopic-ml
  title: "Moisture-driven bending of wood: sensing and prediction"
  years: "2024 - 2025"
  meta:
    role: "First author"
  tags: [cv, ml, aec]
  role: "First author. I built the humidity chamber, the camera-based curvature measurement, the dataset and the model comparison."
  credits: "With E. Baharlou (ARCC 2025)."
  problem: "Wood layers bend as moisture changes. Predicting the bending from measurements would help designers use it."
  what_i_did: "Fabricated 30 bilayer samples of quarter-sawn maple veneer laminated to glass-fiber fabric with epoxy (45 × 135 mm, with the maple layer thickness as the variable). Designed an Arduino-controlled acrylic chamber that conditions the samples at 90% relative humidity, and measured their curvature during exposure with a Raspberry Pi webcam and OpenCV (Canny edge detection and Hough circle fitting). Built the dataset with engineered features and benchmarked supervised regression models against the Timoshenko bilayer equation, tuning them by grid search with k-fold cross-validation and validating them on one held-out test sample."
  result: "On the test sample, with a measured bending radius of 101 mm, CatBoost predicted 112 mm, the closest of the machine-learning models. Gaussian Process, the best model in cross-validation, did not generalize to that sample."
  publications: [ma-2025-arcc]
  links: []
  story:
    - id: humidity-chamber
      heading: "Humidity chamber"
      body: "Two Arduino Uno boards read two DHT22 humidity and temperature sensors every five seconds, time-stamp the readings with a DS3231 clock, show them on an OLED display, log them to an SD card, and switch two ultrasonic mist makers through a relay when humidity falls below 90%."
      images:
        - src: wood-hygroscopic-ml/chamber_circuit_uno.png
          narrow_src: wood-hygroscopic-ml/chamber_circuit_uno_portrait.png
          alt: "Illustrated wiring diagram of the chamber: two Arduino Uno boards side by side, with two DHT22 humidity and temperature sensors above them on shared sensor lines; board 1 drives a two-channel relay wired to two ultrasonic mist makers; board 2 connects to an OLED display, an SD card module and a DS3231 clock; a dashed ground line joins the two boards."
          caption: "Circuit of the humidity chamber, redrawn from the original wiring sketch. Gold: sensor and clock lines; white: control and output lines; dashed: shared ground."
        - src: wood-hygroscopic-ml/chamber_photo.jpg
          alt: "Photo of the humidity chamber: a clear acrylic box on a white backdrop, with sensor wires taped along its top edge and down to humidity sensors inside, a mist-maker container in one corner, and the relay, Arduino boards and a lit OLED display on the table to its right."
          caption: "The humidity chamber and its electronics, November 2023."
    - id: comparing-models
      heading: "Comparing models"
      body: "One test sample, shown with the paper's five-feature set, passes through each model in turn; every clip ends on that model's prediction against the measured bending radius of 101 mm."
      videos:
        - src: wood-hygroscopic-ml/models_compare_v2.mp4
          poster: wood-hygroscopic-ml/models_compare_v2_poster.jpg
          caption: "How each model turns the test sample's measurements into a predicted curvature. Mechanisms are schematic; predictions are from the paper's validation table."
      images:
        - src: wood-hygroscopic-ml/models_overview.png
          alt: "Ten small panels, one per model, each with a bar for predicted curvature next to a tick for the measured value, and a predicted arc next to the measured arc. Predicted radii: CatBoost 112 mm, XGBoost 117 mm, decision tree 471 mm, random forest 226 mm, linear 129 mm, ridge 129 mm, lasso 228 mm, Gaussian process not shown, MLP 26 mm, Timoshenko equation 123 mm; measured 101 mm."
          caption: "Predictions for the test sample. Gold: predicted (validation table of the paper); blue: measured, R ≈ 101 mm."
  media:
    thumbnail:
      src: wood-hygroscopic-ml/lead_radii_v4_poster.jpg
      alt: "On black, six thin wood strips in clamps at the upper right, each with a gold arc and a dashed full circle around it; centre marks with radius lines lead down to labels from R ≈ 190 mm to R ≈ 320 mm."
      fit: contain
    video:
      src: wood-hygroscopic-ml/lead_radii_v4.mp4
      poster: wood-hygroscopic-ml/lead_radii_v4_poster.jpg
      caption: "Six bilayer samples bending, 3.6 hours in 5 seconds: a circle is fitted to each strip in every frame, then the view pulls back to show the full circles and their radii. Drawn by code on a documentation camera's video; the radii are camera estimates, not the paper's measurements."
- slug: system-design
  title: "System design"
  years: "2025 - 2026"
  meta:
    role: "Design and build"
  tags: [robotics, software, sensing]
  role: "Designed and built three systems: a ROS 2 control stack for KUKA print cells with robot channels in parallel, a simulation of nozzle-tilt planning on a KUKA KR 120 and a KR10, and a heat-flux test box for printed panels. The ROS 2 code was implemented with Claude Code (AI coding assistant)."
  credits: "ROS 2 repository author: Ye Ma. Chair toolpath by E. Baharlou; KR10 robot model and DP baseline from the kuka-sim repository. Heat-flux test box: with I. Datta and E. Baharlou."
  problem: "Robotic printing needs a control stack that can be shared and moved between robots, a way to plan the nozzle on non-planar layers before printing, and instruments that measure the printed parts."
  what_i_did: "Ported the closed-loop printing pipeline to ROS 2 with robot channels in parallel, simulated print programs and nozzle-tilt planning on a KUKA KR 120 and a KR10, and built a heat-flux test box for printed panels."
  story:
    - id: ros2-port
      heading: "ROS 2 control stack with parallel robot channels"
      body: "The closed-loop pipeline runs as one ROS 2 (Jazzy) graph on an edge PC: camera capture, two bead-width readers, the control law and a session recorder (rosbag2). The same speed commands go to whichever robot channel the cell has: an RSI bridge whose 4 ms reply loop runs in its own process (KUKA KR10), and an EthernetKRL bridge for controllers without RSI (templates, not yet run). The KUKA KR 120 has neither; it takes the commands through KukaVarProxy every 250 ms, in a lab pipeline outside the repository. Safety rules (no path correction, override clamp, watchdog ramp) are enforced in code and tested in CI. In a lock-step replay of a real print, the port reproduces the original pipeline's speed commands at all 1719 updates."
      videos:
        - src: system-design/ros_arch.mp4
          poster: system-design/ros_arch_poster.jpg
          caption: "The ROS 2 graph: cameras and borescopes, width readers, control law, then RSI, EthernetKRL and KukaVarProxy channels in parallel. Dashed: the KukaVarProxy channel is a lab pipeline, not part of the public repository."
      link:
        label: "GitHub repository: RSI_proj_ROS"
        url: "https://github.com/yem-hjk6th/RSI_proj_ROS"
    - id: nozzle-tilt
      heading: "Nozzle-tilt planning for non-planar printing (simulation)"
      body: "A KR 120 on a linear rail runs a chair print program layer by layer in simulation. The program uses flat layers with a fixed tool, but its walls lean up to 45 degrees from vertical, where flat layers stair-step: there, tilting the nozzle with the surface (non-planar printing) would apply. Concept, work in progress."
      videos:
        - src: rl-nonplanar-nozzle-tilt/kr120_chair_lead.mp4
          poster: rl-nonplanar-nozzle-tilt/kr120_chair_lead_poster.jpg
          caption: "A KR 120 on a linear rail printing a chair toolpath in simulation (time-lapse; toolpath by E. Baharlou). The red zones mark walls leaning up to 45 degrees, where tilting the nozzle would apply."
    - id: kr10-toy
      heading: "A first tilt-planning test on the KR10"
      body: "A dome-shaped layer of 301 points, ten nozzle tilts per point (0 to 45 degrees), and a reward made of reachability, joint-limit margin, wrist singularity and smoothness, with a slot for a print-quality term. A dynamic-programming (DP) planner gives the exact optimum; a tabular reinforcement-learning (RL) loop is trained on the same task. With the kinematic costs alone, both keep the nozzle vertical. A tilt is only worth planning if print quality depends on it; reinforcement learning is useful once that quality can only be measured on prints, which is the open part of the project."
      videos:
        - src: rl-nonplanar-nozzle-tilt/rl_toy_web.mp4
          poster: rl-nonplanar-nozzle-tilt/rl_toy_web_poster.jpg
          caption: "KR10 simulation, drawn as a stick figure from forward kinematics, on a dome-shaped layer. Gold: DP planner; blue: reinforcement learning (tabular stub). The quality term in the second half is a placeholder, not a measurement."
      link:
        label: "Simulation base: kuka-sim (KR10 model and DP baseline)"
        url: "https://github.com/yem-hjk6th/kuka-sim"
    - id: heat-flux-test-box
      heading: "Heat-flux test box for printed panels"
      body: "An insulated box measures how well printed mycelium-mineral panels resist heat flow in place: a heating mat and an aluminium plate under the panel, three heat-flux sensors and thermocouples on it, 24-bit acquisition on an Arduino and Python analysis, following the ASTM C1046 and C1155 methods. Results are not yet published."
      images:
        - src: heat-flux-test-box/box_section.svg
          alt: "Labelled half section of the test box with an enlarged view of the layer stack at the panel centre"
          credit: "Drawing generated from the build documentation"
        - src: heat-flux-test-box/wiring.svg
          alt: "Signal chain: three heat-flux sensors to a 24-bit ADC, an Arduino and a PC logger; four thermocouples to a separate logger"
          credit: "Drawing generated from the logger code"
  result: "In a lock-step replay of a real print, the ROS 2 port reproduces the original pipeline's speed commands at all 1719 updates."
  links:
    - label: "GitHub repository: RSI_proj_ROS"
      url: "https://github.com/yem-hjk6th/RSI_proj_ROS"
    - label: "kuka-sim (KR10 model and DP baseline)"
      url: "https://github.com/yem-hjk6th/kuka-sim"
  media:
    thumbnail:
      src: system-design/kr120_cases_8_v2_poster.jpg
      alt: "Eight simulated KUKA KR 120 robot arms on rails in a two-row grid, each printing a different blue test shape on a dark bed, one of them a chair."
      fit: contain
    video:
      src: system-design/kr120_cases_8_v2.mp4
      poster: system-design/kr120_cases_8_v2_poster.jpg
      caption: "Eight print programs simulated in parallel on a kinematic model of a KUKA KR 120 on a linear rail, each checked for reach, joint limits and workspace. The chair replays a real robot program (toolpath by E. Baharlou); the others are generated test paths."
- slug: hsr-station-competitions
  title: "Selected practice work"
  years: "2020 - 2022"
  meta:
    place: "CCTN, Shanghai"
    role: "Architectural designer"
  tags: [aec, design]
  role: "Architectural designer at CCTN in Shanghai, on competition bids for rail stations and on the renewal of an older office tower in a TOD area: Xiayan Road Station was my own design; on the Cixi station bid I designed part of the ancillary podium and the landscape buildings; at Nanjing South I worked on a small part of the interior; I worked on the four-station Weifang-Suqian tender, which included Lanling; on a rail technology innovation centre campus in Chengdu I took one building through design development; and for the office tower renewal I developed one facade scheme, from the facade geometry in Rhino and Grasshopper to the Enscape renders."
  credits: "Team work at CCTN, Shanghai. Several of the renders are by render studios CCTN commissioned. The three clips are drawn by code from the designs' Rhino exports; the cup outlines at the start of the Lanling clip are redrawn from the scheme's concept slides."
  problem: "Competition bids for new rail stations and their station areas in eastern China, and the renewal of an older office tower in a transit-oriented development (TOD) area of Shanghai: building form, roof and facade, and renders, delivered to bid deadlines."
  what_i_did: "Designed Xiayan Road Station, an urban-rail station over an elevated line, from the site model to the final skin in Rhino and Grasshopper. Worked on the Weifang-Suqian high-speed-rail tender for four stations (Anqiu, Yinan, Lanling and Tancheng West), designed part of the ancillary podium and the landscape buildings of the Cixi station bid, and worked on a small part of the interior of Nanjing South. Took one podium building of an R&D campus for a rail technology innovation centre in Chengdu through design development. For the renewal of an older office tower in a TOD area of Shanghai, developed one facade scheme: a single curved surface that wraps the tower, turns into the entrance canopy and is divided into vertical fins."
  story:
    - id: xiayan-road
      heading: "Xiayan Road Station"
      body: "An urban-rail station over an elevated line, with ancillary blocks and a park beside a river, January to February 2022. My own design. The clip at the top of the page starts from the city around the line: the skyline of the blocks on each side is drawn as a folding screen, both screens are projected onto the two edges of the platform, and the station grows from the track between them. The rest of the clip rebuilds the design from the Rhino exports of that time: the main volume over the line and the ancillary blocks of January 25, then the roof surfaces, slabs, metal fins, glass and louvers of February 11 to 14."
      images:
        - src: hsr-station-competitions/xiayan_aerial.jpg
          alt: "Aerial render: a long white station roof with a wave-like rise in the middle straddles an elevated rail line; low white ancillary blocks with planted roofs stand on both sides, with parking, sports courts and a river park in front."
          caption: "Aerial view, February 2022."
    - id: lanling
      heading: "Lanling Station"
      body: "Part of the Weifang-Suqian high-speed-rail tender for four stations (Anqiu, Yinan, Lanling and Tancheng West), November 2021 to February 2022; I worked on the four-station tender. The concept of this Lanling scheme came from the town's wine: two bronze wine cups raised together. Stretched out and pressed down, the two cup outlines become the two halves of a long roof, the space between them becomes an arched glass front, and a diamond lattice covers the white shell."
      images:
        - src: hsr-station-competitions/lanling_front.jpg
          alt: "Frontal render of a white lattice-shell station across a wide paved square, the roof rising to an arched glass entrance in the middle and tapering to points at both ends."
          caption: "Front, December 2021."
      videos:
        - src: hsr-station-competitions/lanling_massing.mp4
          poster: hsr-station-competitions/lanling_massing_poster.jpg
          caption: "Drawn by code from the scheme's Rhino exports of December 16 and 20, 2021. The cup outlines in the first step are redrawn from the concept slides, and the order of the steps is a reconstruction for illustration. Gold: the part added in each step; greys: the shell; slate: glass."
    - id: cixi
      heading: "Cixi Station bid"
      body: "A station bid with a lake in the middle of the station area, September to October 2021. I designed part of the ancillary podium and the landscape buildings. Both renders come from the bid document."
      images:
        - src: hsr-station-competitions/cixi_aerial_station.jpg
          alt: "Aerial render in soft morning light: a long station with white, upswept roofs over many tracks and a steel footbridge across them; terraced white pavilions stand among trees on the far side, a plaza with red sculptures runs down to a lake, and green-roofed low buildings and a white ribbon-like bridge over a canal are in front."
          caption: "The station, its ancillary buildings and the lake, October 2021."
        - src: hsr-station-competitions/cixi_aerial_sunset.jpg
          alt: "Aerial render at sunset: the station's white roofs at the right edge, a rounded lake with moored boats in front of it, office towers on the left, and low landscape buildings with oval planted roofs among trees in the foreground."
          caption: "The lake and the landscape buildings at sunset, October 2021."
    - id: chengdu-rnd-campus
      heading: "R&D campus, Chengdu"
      body: "A research campus of five building groups beside a lake in Chengdu, 2021. I took one of its podium buildings through design development, working out its plans, facade and links to the neighbouring blocks."
      images:
        - src: hsr-station-competitions/chengdu_campus_lakeside.jpg
          alt: "Render of a glass-clad research campus seen from a lakeside cycle path: a long low building of stacked, offset glass boxes with a timber-clad base, a taller glass block at its left end and a city skyline behind."
          caption: "The campus seen from the lakeside path, 2021."
    - id: office-facade
      heading: "Renewal of an older office tower in a TOD area"
      body: "An 18-storey office tower and podium from around 2000, on a ring road in a transit-oriented development (TOD) area of Shanghai, needed a new facade in 2021: its skin and roof looked dated, its entrances were cramped and its round corner column had little presence. I developed one scheme from the existing massing. The old skin and the corner column come off, and a single curved surface wraps the tower: it runs from the roof edge down the facade and out over the podium as the entrance canopy. An arch-shaped notch at the corner opens onto the glass behind it, with metal trims along its edges, and the surface is divided into 44 vertical fins about 1.5 m apart that follow its flow from the canopy up the tower."
      images:
        - src: hsr-station-competitions/facade_render_dusk.jpg
          alt: "Render at dusk of a white office tower wrapped by one finely ribbed curved surface that sweeps down from the roof into a long canopy over a glazed podium, with a tall arch-shaped glass opening at the tower corner."
          caption: "Enscape render, November 2021."
      videos:
        - src: hsr-station-competitions/facade_logic.mp4
          poster: hsr-station-competitions/facade_logic_poster.jpg
          caption: "The steps of the scheme as modeled in October and November 2021, drawn from the Rhino exports (orthographic view, flat shading): the existing tower, the corner smoothed into one curve, the wrapping surface, the corner arch and the fins. The clip ends on the aerial render of November 2021. The order of the steps is a reconstruction for illustration."
    - id: patents
      heading: "Patents"
      body: "CN112627665B (granted 2022): a push-out window that opens by motor or by hand, switched by one handle. CN111236790B (granted 2021): a synchronizer that keeps several motorised window openers in step with closed-loop speed control. Co-inventor on both."
  result: null
  links: []
  media:
    thumbnail:
      src: hsr-station-competitions/xiayan_aerial.jpg
      alt: "Aerial render of Xiayan Road Station: a long white wave-shaped roof over an elevated rail line, with white ancillary blocks with planted roofs on both sides."
      fit: cover
    video:
      src: hsr-station-competitions/xiayan_massing.mp4
      poster: hsr-station-competitions/xiayan_massing_poster.jpg
      caption: "Xiayan Road Station, drawn by code from the design's Rhino exports: the skylines of both sides projected onto the platform, then the massing of January 25, 2022 and the skin of February 14. Grey: structure and context; blue: existing context (the river, and the blocks whose skyline is read); gold: the part added in each step."
