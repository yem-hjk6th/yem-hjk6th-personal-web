- slug: cs-projects
  title: "Computer science projects"
  years: "2022 - 2026"
  meta:
    place: "UVA and earlier"
    role: "Course projects and a short paper"
  tags: [cv, ml]
  role: "Small computer science projects: a single-author conference paper on EEG emotion recognition (2022), and course projects in two CS 6501 courses at UVA: Machine Learning in Image Analysis (team project, evaluation) and signal processing (course work)."
  credits: "EEG paper: single author (IEEE ICFTIC 2022); data: SEED dataset (BCMI laboratory). Fourier-Net: team project; model and code from the original Fourier-Net authors. EEG data in the signal-processing sections: CHB-MIT Scalp EEG Database v1.0.0 (Guttag, 2010, PhysioNet; Shoeb, 2009, MIT PhD thesis), Open Data Commons Attribution License v1.0. All audio is synthesised; no course recordings are used."
  problem: "Small projects, each around one question: can a CNN read emotion from EEG turned into colour images; does a registration network trained on digits align shapes it has never seen; and what do classic signal-processing ideas look and sound like?"
  what_i_did: "Trained a CNN on EEG recordings mapped to colour images; tested 16 Fourier-Net-Diff registration models on unseen sketch classes (80 test runs); and animated and sonified topics from a signal-processing course."
  story:
    - id: eeg-emotion-cnn
      heading: "EEG emotion recognition with a CNN (2022, paper)"
      body: "Filtered 62-channel EEG from the SEED dataset, turned each recording into a colour image by mapping theta, alpha and beta plus low-gamma band amplitudes to red, green and blue, and trained a convolutional network to separate positive from negative emotion. The CNN reached 89.5% accuracy, against 76.8% for Gaussian naive Bayes and 73.0% for an SVM."
      videos:
        - src: eeg-emotion-cnn/eeg_cnn_pipeline_v3.mp4
          poster: eeg-emotion-cnn/eeg_cnn_pipeline_v3_poster.jpg
          caption: "The paper's pipeline re-drawn: 62 electrodes, band amplitudes mapped to colour, the CNN, and the results of the paper's Table 1. The signals in the clip are synthetic."
    - id: fourier-net
      heading: "Fourier-Net: transfer to unseen shapes (2024)"
      body: "Tested 16 Fourier-Net-Diff models, each trained on an MNIST digit set, on five unseen QuickDraw classes (circle, envelope, moon, T-shirt, triangle): 80 test runs, scored by Dice overlap. Median Dice was 0.47-0.58 per class (envelope highest, triangle lowest), and the model trained on digit 1 was the weakest in every class. My part: application and evaluation on a university HPC cluster, and the report's introduction, background and conclusion. The video at the top of this page shows the experiment."
    - id: fourier-follow-up
      heading: "Fourier-Net follow-up (unpublished)"
      body: "In an unpublished feasibility trial I trained the same kind of model on time-lapse clips of bending wood strips. With larger frame gaps and a loss restricted to the strips, it followed about 85% of the strip-tip motion, but not the curvature trend; classical optical flow did better on these clips."
    - id: karplus-strong
      heading: "Signal processing (2025): plucked string"
      body: "A noise burst circulates in a delay loop with a two-sample average; each pass removes high frequencies, so the tone decays like a plucked string. Play the bursts alone, then the same bursts through the loop."
      videos:
        - src: cs6501-dsp-visualisations/dsp_karplus_strong.mp4
          poster: cs6501-dsp-visualisations/dsp_karplus_strong_poster.jpg
          caption: "Karplus-Strong synthesis, re-implemented from a course demo (not a submitted assignment); 110 Hz, loop gain 0.996."
      audios:
        - src: cs6501-dsp-visualisations/ks_input_noise_bursts.mp3
          label: "Input: six noise bursts"
        - src: cs6501-dsp-visualisations/ks_output_strings.mp3
          label: "Output: through the loop"
          caption: "Loop length set by each note's pitch (A3 to A4), loop gain 0.996."
    - id: comb-filters
      heading: "Signal processing: echo and reverb from comb filters"
      body: "A feed-forward comb filter adds one delayed copy of the signal (an echo); a feedback comb filter feeds the output back, so the copies repeat and decay (reverb). Summing four feedback filters with different delays gives a denser reverb. Delays and gains are those of the assignment: 100 ms and 0.75, then 100, 90, 120 and 110 ms with gains 0.75, 0.80, 0.77 and 0.73."
      audios:
        - src: cs6501-dsp-visualisations/comb_dry.mp3
          label: "Original: a dry synthesised phrase"
        - src: cs6501-dsp-visualisations/comb_ffcf_echo.mp3
          label: "Feed-forward comb: echo"
        - src: cs6501-dsp-visualisations/comb_fbcf_reverb.mp3
          label: "Feedback comb: reverb"
        - src: cs6501-dsp-visualisations/comb_four_fbcf.mp3
          label: "Four feedback combs in parallel"
          caption: "The assignment used a course speech recording; here the same filters are applied to a synthesised phrase. All four clips are matched in loudness."
    - id: eeg-stft
      heading: "Signal processing: a seizure in the spectrogram"
      body: "During the annotated seizure, power rose by 16 dB at 0.5-4 Hz and by 11 dB at 13-30 Hz compared with the two minutes before."
      videos:
        - src: cs6501-dsp-visualisations/dsp_eeg_stft.mp4
          poster: cs6501-dsp-visualisations/dsp_eeg_stft_poster.jpg
          caption: "CHB-MIT record chb01_18, channel 1, 1600-1900 s; short-time Fourier transform with a 2 s Hann window. The steady lines near 16 and 32 Hz run through the whole record."
    - id: window-leakage
      heading: "Signal processing: spectral leakage"
      body: "A strong tone between two frequency bins hides a tone 50 dB weaker; a Hann window lowers the leakage at the weak tone from -36 dB to -93 dB."
      videos:
        - src: cs6501-dsp-visualisations/dsp_window_leakage.mp4
          poster: cs6501-dsp-visualisations/dsp_window_leakage_poster.jpg
          caption: "A synthetic signal, rectangular window morphing into a Hann window."
  publications: [ma-2022-icftic]
  result: "EEG: the CNN reached 89.5% accuracy on positive versus negative emotion. Fourier-Net: median Dice was 0.47-0.58 per unseen class, and the model trained on digit 1 was the weakest in every class."
  links: []
  media:
    thumbnail:
      src: cs6501-fourier-net-registration/fourier_net_transfer_poster.jpg
      alt: "Heatmap of Dice scores for 16 digit-trained registration models on five sketch classes, with the digit-1 row outlined in red and per-class medians from 0.47 to 0.58."
      fit: contain
    video:
      src: cs6501-fourier-net-registration/fourier_net_transfer.mp4
      poster: cs6501-fourier-net-registration/fourier_net_transfer_poster.jpg
      caption: "Fourier-Net course project: sixteen Fourier-Net-Diff models, each trained on a MNIST digit set, tested without retraining on five unseen QuickDraw shape classes (80 runs), with real test outputs. The opening method sketch is an illustration on a synthetic pair."
- slug: tachi-miura-bellows
  title: "Tachi-Miura polyhedron bellows"
  years: "2022 - 2023"
  meta:
    role: "Sole author"
  tags: [aec, fabrication]
  role: "Sole author: folded the paper and cardboard models, analysed their folding geometry and ran the radial load tests."
  credits: "Single-author paper (Journal of Physics: Conference Series, 2023)."
  problem: "Tachi-Miura polyhedron bellows fold flat and open again, but how much load they carry across their axis had hardly been tested."
  what_i_did: "Folded Tachi-Miura bellows from paper and 120 gsm cardboard with different crease parameters, related their folding angles to the sheet geometry, and measured the largest radial load each model carried at increasing axial pre-compression."
  story:
    - id: radial-load
      heading: "Radial load test"
      body: "Each step compresses the bellows axially, which sets its base width and folding angle, then loads it across its axis. The capacity jumps once the folding angle enters the self-locking range."
      videos:
        - src: tachi-miura-bellows/bellows_radial_load.mp4
          poster: tachi-miura-bellows/bellows_radial_load_poster.jpg
          caption: "The radial load test re-drawn from the paper's Table 4: each step compresses the bellows axially (base width W'), then loads it radially; the folding angle follows from W' and the 210 mm sheet width. Side view schematic."
  result: "The radial capacity rose with axial pre-compression and jumped once the folding angle reached the self-locking range: the 120 gsm cardboard bellows carried 8.5 kg under radial load."
  publications: [ma-2023-jpcs]
  links:
    - label: "JPCS paper (open access)"
      url: "https://doi.org/10.1088/1742-6596/2469/1/012014"
  media:
    thumbnail:
      src: tachi-miura-bellows/tmp_fold_axon_v8_poster.jpg
      alt: "Axonometric view of a closed Tachi-Miura bellows made of two folded sheets between a base slab and a load plate, a gold arrow pressing down, counter reading 8.5 kg, fold angle 55.15 degrees."
      fit: contain
    video:
      src: tachi-miura-bellows/tmp_fold_axon_v8.mp4
      poster: tachi-miura-bellows/tmp_fold_axon_v8_poster.jpg
      caption: "From one sheet to a bellows: ridge and valley creases (paper Fig. 4, Table 2, model D) fold rigidly, a second sheet joins it edge to edge into a hollow tube, and the radial load test steps through the six fold angles of Table 4 up to 8.5 kg (120 gsm cardboard). Rigid-folding simulation, axonometric view."
