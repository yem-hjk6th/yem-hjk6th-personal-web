headlines:
  robotics_cv: "PhD candidate building computer vision and robot-telemetry tools for in-process monitoring of robotic 3D printing"
  aec_fabrication: "PhD candidate in robotic fabrication, construction-scale 3D printing and computational design, with an architecture background"
bio: >
  I am a PhD candidate in the Constructed Environment program at the University of Virginia,
  trained as an architect (B.Arch, M.Arch). My dissertation work instruments a KUKA robot
  pellet-extrusion cell with robot telemetry and cameras, so that robot motion and material
  flow can be measured and eventually synchronized. Earlier lab projects cover clay paste printing,
  toolpath design for mycelium-mineral panels, and sensor-plus-machine-learning studies of wood.
  I work between design, robotics and computer vision.
